name = "product-studio-ai"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Set your Gemini API key as an encrypted Cloudflare Pages Secret / Environment Variable:
#   npx wrangler pages secret put GEMINI_API_KEY --project-name product-studio-ai
# (Or configure GEMINI_API_KEY in Cloudflare Dashboard -> Workers & Pages -> Settings -> Variables and Secrets)

# Optional: Bind a Cloudflare KV namespace named STUDIO_KV in Cloudflare Dashboard
# (Settings -> Functions -> KV namespace bindings) for persistent projects, model settings,
# and generated video caching across devices on *.pages.dev.
# Without STUDIO_KV bound, AI Studio features work immediately and projects fall back to browser storage.
# [[kv_namespaces]]
# binding = "STUDIO_KV"
# id = "your-kv-namespace-id"
